<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRO COUNTER</title>
    <style>
        /* Mobile-first styling */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            touch-action: manipulation;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-align: center;
            color: #273CF5;
        }

        #counter {
            font-size: 7rem;
            font-weight: 900;
            background: #1e1e1e;
            padding: 30px 50px;
            border-radius: 20px;
            margin-bottom: 50px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            font-variant-numeric: tabular-nums;
        }

        button {
            background-color: #273CF5;
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #221675, 0 10px 20px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #221675, 0 4px 10px rgba(231, 76, 60, 0.4);
        }
    </style>
</head>
<body>

    <h1>BRO COUNTER</h1>
    <div id="counter">...</div>
    <button id="addBtn">+ ADD</button>

    <script type="module">
        // The "SDKs" Firebase mentioned are imported directly here via URL
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCQ6D6ACknAc9s63dstLPZ_z5HBXOGcWVs",
            authDomain: "bro-621.firebaseapp.com",
            databaseURL: "https://bro-621-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bro-621",
            storageBucket: "bro-621.firebasestorage.app",
            messagingSenderId: "287259008963",
            appId: "1:287259008963:web:ce3b60b8839a8ed5a86776"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Create a reference to a specific spot in the database called "broCount"
        const countRef = ref(db, 'broCount');

        const counterDisplay = document.getElementById('counter');
        const addBtn = document.getElementById('addBtn');

        // LISTEN for changes in real-time
        onValue(countRef, (snapshot) => {
            const currentData = snapshot.val() || 0;
            let displayValue = currentData > 999 ? currentData % 1000 : currentData;
            counterDisplay.textContent = String(displayValue).padStart(3, '0');
        });

        // WRITE to the database when the button is clicked
        addBtn.addEventListener('click', () => {
            runTransaction(countRef, (currentCount) => {
                return (currentCount || 0) + 1;
            });
        });
    </script>
</body>
</html>
