<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRO COUNTER</title>
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none; -webkit-user-select: none;
        }

        body {
            background-color: #0f172a; color: #f8fafc;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }

        .wrapper {
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; height: 75vh; max-height: 520px;
            width: 100%; padding: 20px;
        }

        h1 {
            font-size: 2.25rem; letter-spacing: 0.15em; color: #38bdf8; font-weight: 800;
        }

        .display-card {
            background: #1e293b; border: 3px solid #334155; border-radius: 28px;
            padding: 30px 55px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
            position: relative;
        }

        #counter {
            font-size: 6.5rem; font-weight: 900; font-variant-numeric: tabular-nums;
            color: #f1f5f9; text-shadow: 0 0 25px rgba(56,189,248,0.25);
        }

        /* Tiny green dot to show the user they are connected to the live server */
        .status-dot {
            position: absolute; top: 14px; right: 16px; width: 8px; height: 8px;
            background-color: #22c55e; border-radius: 50%; opacity: 0.4;
            transition: opacity 0.3s;
        }
        .status-dot.syncing { opacity: 1; background-color: #38bdf8; }

        button {
            background: #0284c7; color: white; border: none; border-radius: 9999px;
            width: 88%; max-width: 340px; height: 85px; font-size: 2rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 10px 25px -5px rgba(2,132,199,0.5);
            transition: transform 0.08s, background 0.1s; touch-action: manipulation;
        }

        button:active { transform: scale(0.94); background: #0369a1; }
        
        .live-label {
            font-size: 0.7rem; color: #64748b; letter-spacing: 0.2em; margin-top: -10px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>BRO COUNTER</h1>
        
        <div class="display-card">
            <div class="status-dot" id="dot"></div>
            <div id="counter">...</div>
        </div>
        <div class="live-label">GLOBAL CLOUD SYNC</div>

        <button id="addBtn">+1</button>
    </div>

    <script>
        // -------------------------------------------------------------------------
        // !!! WARNING: CHANGE THE STRING BELOW TO SOMETHING SUPER RANDOM !!!
        // If you leave it as "demo-bro-group-99", you will be sharing a counter 
        // with everyone else on the internet who copy-pasted this code.
        // -------------------------------------------------------------------------
        const GROUP_NAMESPACE = "bro-counter-squad-delta-7721"; 
        
        const API_URL = `https://api.counterapi.dev/v1/${GROUP_NAMESPACE}/count`;
        const display = document.getElementById('counter');
        const dot = document.getElementById('dot');
        const button = document.getElementById('addBtn');

        let currentCount = 0;

        const updateScreen = (num) => {
            // If the global count hits 1,004, this forces the screen to show "004"
            const safeNum = num % 1000; 
            display.textContent = String(safeNum).padStart(3, '0');
        };

        // 1. Ask the cloud what the number is
        const getCloudCount = async () => {
            dot.classList.add('syncing');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (typeof data.count === 'number') {
                    currentCount = data.count;
                    updateScreen(currentCount);
                }
            } catch (err) {
                console.log("Offline mode active.");
            } finally {
                setTimeout(() => dot.classList.remove('syncing'), 400);
            }
        };

        // 2. Tell the cloud someone clicked
        button.addEventListener('click', () => {
            // Optimistic UI: Update the screen instantly before the server even answers 
            // so the user doesn't feel network lag.
            currentCount++;
            updateScreen(currentCount);

            if ('vibrate' in navigator) navigator.vibrate(15);

            // Fire-and-forget the +1 to the server behind the scenes
            fetch(`${API_URL}/up`).catch(() => console.error("Drop packet"));
        });

        // Pull the count the second the page opens
        getCloudCount();

        // "The Radar": Check the cloud every 3.5 seconds to see if a friend clicked it
        setInterval(getCloudCount, 3500);

    </script>
</body>
</html>
